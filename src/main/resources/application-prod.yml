spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Override via environment variables: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.example.springdockerk8sdemo: INFO
    org.hibernate: WARN
    org.springframework: WARN
  file:
    name: /var/log/app/spring-docker-k8s-demo.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 2048
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring.lifecycle.timeout-per-shutdown-phase: 30s

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Disable Swagger in production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
