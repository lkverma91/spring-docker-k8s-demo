# NOTE: In real environments, never store plaintext secrets.
# Use Sealed Secrets, Vault, or External Secrets Operator.
# These are base64-encoded values (postgres / postgres).
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: products-app
type: Opaque
data:
  # echo -n "postgres" | base64
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
