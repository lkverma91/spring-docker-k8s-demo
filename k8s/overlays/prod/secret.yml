# PRODUCTION SECRETS — NEVER commit real values here.
# Use External Secrets Operator, HashiCorp Vault, or Sealed Secrets.
# Inject actual values from CI/CD pipeline via:
#   kubectl create secret generic app-secret \
#     --from-literal=POSTGRES_USER=$PROD_DB_USER \
#     --from-literal=POSTGRES_PASSWORD=$PROD_DB_PASSWORD \
#     --namespace=products-app-prod --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: products-app-prod
type: Opaque
data:
  POSTGRES_USER: REPLACE_WITH_BASE64_ENCODED_VALUE
  POSTGRES_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
